[build]
  command = "npm run build"
  publish = "dist"

# Proxy airline logo CDNs (must come before SPA fallback; force skips file existence check)
[[redirects]]
  from = "/airline-logos/*"
  to = "https://tbbd-flight.s3.ap-southeast-1.amazonaws.com/airlines-logo/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/gstatic-logos/*"
  to = "https://www.gstatic.com/flights/airline_logos/70px/:splat"
  status = 200
  force = true

# SPA: serve index.html for all routes so client-side routing works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
